<!DOCTYPE html>
<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<title>PA#2</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        background-color: #402666;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 30px 20px;
        font-family: sans-serif;
        color: #fff;
    }

    h2 {
        margin-bottom: 20px;
        text-align: center;
        color: #fff;
    }

    #canvas-holder {
        display: flex;
        justify-content: center;
        margin-bottom: 24px;
    }

    #webglcanvas {
        display: block;
        background-color: #000;
    }

    .controls {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px 40px;
        width: 100%;
        max-width: 620px;
    }

    .control-item {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .control-item label {
        display: flex;
        justify-content: space-between;
        font-size: 0.9em;
        color: #ddd;
    }

    .control-item label span {
        color: #ffcc00;
        font-weight: bold;
        font-family: monospace;
    }

    input[type="range"] {
        width: 100%;
        accent-color: #a070cc;
    }
</style>

<script src="./Utils/trackball-rotator.js"></script>
<script src="./Utils/m4.js"></script>
<script src="./shader.gpu"></script>
<script src="./Model.js"></script>
<script src="./StereoCamera.js"></script>
<script src="./Texture.js"></script>
<script src="./main.js"></script>

</head>
<body onload="init()">

<h2>Conjugation of Two Coaxial Cylinders of Different Diameters</h2>

<div id="canvas-holder">
    <canvas width="600" height="600" id="webglcanvas"></canvas>
</div>

<div class="controls">
    <div class="control-item">
        <label>Eye Separation <span id="valEyeSep">0.7</span></label>
        <input type="range" id="eyeSeparation" min="0.1" max="2.0" step="0.1" value="0.7"
               oninput="document.getElementById('valEyeSep').textContent=parseFloat(this.value).toFixed(1); updateParameters();">
    </div>

    <div class="control-item">
        <label>Field of View <span id="valFov">0.40</span></label>
        <input type="range" id="fov" min="0.1" max="1.5" step="0.05" value="0.4"
               oninput="document.getElementById('valFov').textContent=parseFloat(this.value).toFixed(2); updateParameters();">
    </div>

    <div class="control-item">
        <label>Near Clipping <span id="valNear">0.5</span></label>
        <input type="range" id="nearClipping" min="0.1" max="5.0" step="0.1" value="0.5"
               oninput="document.getElementById('valNear').textContent=parseFloat(this.value).toFixed(1); updateParameters();">
    </div>

    <div class="control-item">
        <label>Convergence <span id="valConv">14.0</span></label>
        <input type="range" id="convergence" min="1.0" max="30.0" step="0.5" value="14.0"
               oninput="document.getElementById('valConv').textContent=parseFloat(this.value).toFixed(1); updateParameters();">
    </div>
</div>
<div class="controls" style="margin-top: 16px;">
    <div class="control-item" style="grid-column: span 2;">
        <label>Sensor Server
            <span id="wsStatus" style="color:#ff4444;">Disconnected</span>
        </label>
        <div style="display:flex; gap:8px; align-items:center;">
            <input type="text" id="sensorIP" value="192.168.1.100"
                   style="flex:1; padding:4px; border-radius:4px; border:none;
                          background:#2a1a44; color:#fff; font-family:monospace;">
            <input type="text" id="sensorPort" value="8080"
                   style="width:70px; padding:4px; border-radius:4px; border:none;
                          background:#2a1a44; color:#fff; font-family:monospace;">
            <button onclick="connectSensor()"
                    style="padding:4px 14px; background:#a070cc; border:none;
                           border-radius:4px; color:#fff; cursor:pointer;">
                Connect
            </button>
        </div>
    </div>
</div>

</body></html>
